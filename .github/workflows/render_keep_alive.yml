name: 24-7 Render Keep-Alive Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping MRS Solar Render Public URLs
        run: |
          echo 'Sending keep-alive ping to Render public endpoints...'
          curl -sS -o /dev/null -w 'mrs-solar1 status: %{http_code}\n' --max-time 30 https://mrs-solar1.onrender.com/api/health || true
          curl -sS -o /dev/null -w 'mrs-solar status: %{http_code}\n' --max-time 30 https://mrs-solar.onrender.com/api/health || true
          echo 'Keep-alive ping completed successfully!'
