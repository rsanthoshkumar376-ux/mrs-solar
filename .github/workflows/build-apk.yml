name: Build MRS SOLAR Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        id: assemble
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log
        continue-on-error: true

      - name: Report Build Failure on GitHub Summary
        if: steps.assemble.outcome == 'failure'
        run: |
          echo "### ❌ Android Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          APK_PATH=$(find android -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-output/MRS-SOLAR.apk
          echo "APK build complete:"
          ls -lh release-output/MRS-SOLAR.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MRS-SOLAR-Android-APK
          path: release-output/MRS-SOLAR.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: app-release
          name: MRS SOLAR Android Application (.apk)
          make_latest: true
          body: |
            ## 📱 MRS SOLAR Android Application (APK)
            Official Android installer for **MRS SOLAR Solar Panel Loan Management Portal**.

            ### ⬇️ Download:
            Download **MRS-SOLAR.apk** below to install directly on any Android smartphone or tablet.

            ### ✨ Key Features:
            - **Native Standalone Mode:** Fast, full-screen portal experience without web browser bars.
            - **Smooth Receipt & Document Uploads:** Camera and photo gallery access enabled.
            - **Pull-To-Refresh:** Quick swipe down to refresh loan computations and customer payments.
            - **Direct WhatsApp & Phone Integration:** One-tap calling and messaging for customer follow-ups.
            - **Offline Safe:** Friendly connection retry screen when mobile data is paused.
          files: release-output/MRS-SOLAR.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
