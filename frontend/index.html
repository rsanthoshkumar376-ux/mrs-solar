<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MRS SOLAR" />
    <meta name="description" content="MRS SOLAR provides flexible, interest-reducing solar panel installation financing. Manage your monthly EMIs and loan statements." />
    <title>MRS SOLAR – Solar Panel Loan Management App</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Global Pre-bundle Fail-safe Declarations -->
    <script>
      // Immunity Polyfill: Guarantees 'isTa' is always defined globally across any legacy or active chunk
      var isTa = false;
      try {
        var currentLang = localStorage.getItem('mrs_solar_lang') || localStorage.getItem('language') || 'en';
        isTa = (currentLang === 'ta');
      } catch (e) {
        isTa = false;
      }
      window.isTa = isTa;
      window.lang = isTa ? 'ta' : 'en';
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root">
      <!-- Instant pre-React visual loader preventing blank screen on cold starts -->
      <div id="mrs-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090d1a; color: #fff; font-family: Inter, system-ui, -apple-system, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background: rgba(13, 148, 136, 0.25); border: 1.5px solid rgba(45, 212, 191, 0.4); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 12px 30px -5px rgba(13, 148, 136, 0.35);">
          <svg style="width: 36px; height: 36px; color: #facc15;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </div>
        <h1 style="font-size: 26px; font-weight: 900; margin: 0 0 6px 0; letter-spacing: -0.5px;">MRS <span style="color: #2dd4bf;">SOLAR</span></h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 16px 0;">Solar Panel Loan & Installation Management</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(45, 212, 191, 0.2); border-top-color: #2dd4bf; border-radius: 50%; animation: mrsSpin 0.8s linear infinite;"></div>
        
        <!-- Emergency Recovery Button (Appears if network hangs or initial mount takes > 4s) -->
        <div id="mrs-loader-reset-btn" style="display: none; margin-top: 20px;">
          <button type="button" onclick="mrsEmergencyReset()" style="background: #0d9488; color: #fff; border: 1px solid rgba(45, 212, 191, 0.4); padding: 10px 20px; border-radius: 9999px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 6px 16px rgba(13,148,136,0.35);">
            ↻ Clear Cache & Open Portal
          </button>
        </div>

        <style>
          @keyframes mrsSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>

    <script>
      function mrsEmergencyReset() {
        try {
          sessionStorage.clear();
          localStorage.removeItem('mrs_solar_cache_ts');
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              window.location.href = window.location.origin + window.location.pathname + '?v=' + Date.now();
            });
            return;
          }
        } catch (e) {}
        window.location.href = window.location.origin + window.location.pathname + '?v=' + Date.now();
      }

      // Display emergency reset if loading takes longer than 4.5 seconds
      setTimeout(function() {
        var btn = document.getElementById('mrs-loader-reset-btn');
        var preloader = document.getElementById('mrs-preloader');
        if (btn && preloader && document.body.contains(preloader)) {
          btn.style.display = 'block';
        }
      }, 4500);

      // 1. Auto-recover from stale cached chunks after new deployment
      window.addEventListener('vite:preloadError', function() {
        if (!sessionStorage.getItem('mrs_preload_reloaded')) {
          sessionStorage.setItem('mrs_preload_reloaded', '1');
          console.warn('[Vite] Chunk preload mismatch, reloading fresh bundle...');
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              window.location.href = window.location.origin + window.location.pathname + '?v=' + Date.now();
            });
          } else {
            window.location.href = window.location.origin + window.location.pathname + '?v=' + Date.now();
          }
        }
      });

      // Clear reload guard once page successfully loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          sessionStorage.removeItem('mrs_preload_reloaded');
        }, 10000);
      });

      // 2. Register & auto-update Progressive Web App service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
            reg.onupdatefound = function() {
              var installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function() {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] Fresh MRS SOLAR version available.');
                  }
                };
              }
            };
          }).catch(function(err) {
            console.warn('[PWA] ServiceWorker failed:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
