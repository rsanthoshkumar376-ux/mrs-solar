<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.84" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="192" height="192" rx="42.24" fill="url(#bgGrad)" />

  <!-- Subtle Border -->
  <rect x="3.84" y="3.84" width="184.32" height="184.32" rx="38.400000000000006" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2.88" />

  <!-- Central Solar Sun with Rays -->
  <g transform="translate(96, 80.64)" filter="url(#glow)">
    <!-- Sun Center -->
    <circle r="30.72" fill="url(#sunGrad)" />

    <!-- 8 Sun Rays -->
    <g stroke="url(#sunGrad)" stroke-width="6.720000000000001" stroke-linecap="round">
      <line y1="-40.32" y2="-51.84" />
      <line y1="40.32" y2="51.84" />
      <line x1="-40.32" x2="-51.84" />
      <line x1="40.32" x2="51.84" />
      <line x1="-28.799999999999997" y1="-28.799999999999997" x2="-36.480000000000004" y2="-36.480000000000004" />
      <line x1="28.799999999999997" y1="-28.799999999999997" x2="36.480000000000004" y2="-36.480000000000004" />
      <line x1="-28.799999999999997" y1="28.799999999999997" x2="-36.480000000000004" y2="36.480000000000004" />
      <line x1="28.799999999999997" y1="28.799999999999997" x2="36.480000000000004" y2="36.480000000000004" />
    </g>
  </g>

  <!-- Solar Grid / Panel Symbol -->
  <g transform="translate(48, 124.80000000000001)">
    <rect width="96" height="23.04" rx="3.84" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.536" />
    <!-- Grid lines -->
    <line x1="31.872" y1="0" x2="31.872" y2="23.04" stroke="#2dd4bf" stroke-width="1.536" opacity="0.7" />
    <line x1="63.93600000000001" y1="0" x2="63.93600000000001" y2="23.04" stroke="#2dd4bf" stroke-width="1.536" opacity="0.7" />
    <line x1="0" y1="11.52" x2="96" y2="11.52" stroke="#2dd4bf" stroke-width="1.536" opacity="0.7" />
  </g>

  <!-- App Title Banner -->
  <text x="96" y="168.96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17.28" font-weight="900" fill="#ffffff" letter-spacing="1.92">MRS SOLAR</text>
</svg>