<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10.24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)" />

  <!-- Subtle Border -->
  <rect x="10.24" y="10.24" width="491.52" height="491.52" rx="102.4" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="7.68" />

  <!-- Central Solar Sun with Rays -->
  <g transform="translate(256, 215.04)" filter="url(#glow)">
    <!-- Sun Center -->
    <circle r="81.92" fill="url(#sunGrad)" />

    <!-- 8 Sun Rays -->
    <g stroke="url(#sunGrad)" stroke-width="17.92" stroke-linecap="round">
      <line y1="-107.52" y2="-138.24" />
      <line y1="107.52" y2="138.24" />
      <line x1="-107.52" x2="-138.24" />
      <line x1="107.52" x2="138.24" />
      <line x1="-76.8" y1="-76.8" x2="-97.28" y2="-97.28" />
      <line x1="76.8" y1="-76.8" x2="97.28" y2="-97.28" />
      <line x1="-76.8" y1="76.8" x2="-97.28" y2="97.28" />
      <line x1="76.8" y1="76.8" x2="97.28" y2="97.28" />
    </g>
  </g>

  <!-- Solar Grid / Panel Symbol -->
  <g transform="translate(128, 332.8)">
    <rect width="256" height="61.44" rx="10.24" fill="#134e4a" stroke="#2dd4bf" stroke-width="4.096" />
    <!-- Grid lines -->
    <line x1="84.992" y1="0" x2="84.992" y2="61.44" stroke="#2dd4bf" stroke-width="4.096" opacity="0.7" />
    <line x1="170.496" y1="0" x2="170.496" y2="61.44" stroke="#2dd4bf" stroke-width="4.096" opacity="0.7" />
    <line x1="0" y1="30.72" x2="256" y2="30.72" stroke="#2dd4bf" stroke-width="4.096" opacity="0.7" />
  </g>

  <!-- App Title Banner -->
  <text x="256" y="450.56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46.08" font-weight="900" fill="#ffffff" letter-spacing="5.12">MRS SOLAR</text>
</svg>