services:
  - type: web
    name: mrs-solar
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend && npm install --prefix backend
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: mrs_solar_secret_key_2024
