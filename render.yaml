services:
  - type: web
    name: mrs-solar
    env: node
    region: oregon
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: mrs_solar_secret_key_2024
